[build]
builder = "NIXPACKS"
buildCommand = "cd frontend && npm ci && npm run build && cd .. && pip install -r backend/requirements.txt"

[deploy]
startCommand = "cd backend && python main.py --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
FLASK_ENV = "production"
LOG_LEVEL = "INFO"
SERVE_FRONTEND = "true"
ENABLE_WEBSOCKET = "true"
ENABLE_RATE_LIMITING = "true"
RATE_LIMIT_REQUESTS = "1000"

# IMPORTANT: Set these variables in Railway dashboard:
# DATABASE_URL = "postgresql://user:pass@host:port/dbname" (from Railway PostgreSQL service)
# SECRET_KEY = "your-secure-secret-key-32-chars-minimum"
# JWT_SECRET_KEY = "your-secure-jwt-secret-key-32-chars"
# ADMIN_SECRET = "your-admin-password"
# REDIS_URL = "redis://host:port" (optional, from Railway Redis service)