[build]
builder = "NIXPACKS"
buildCommand = "npm ci --prefix frontend && npm run build --prefix frontend && pip install -r backend/requirements.txt"

[deploy]
startCommand = "python backend/main.py --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
FLASK_ENV = "production"
LOG_LEVEL = "INFO"
SERVE_FRONTEND = "true"
ENABLE_WEBSOCKET = "true"
ENABLE_RATE_LIMITING = "true"
RATE_LIMIT_REQUESTS = "1000"